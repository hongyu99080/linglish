<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="人物与时间小镇一天场景插图">
  <!-- 天空四段:晨 午 暮 夜 -->
  <rect x="0" y="0" width="200" height="360" fill="#ffe3c8"/>
  <rect x="200" y="0" width="200" height="360" fill="#d8edf9"/>
  <rect x="400" y="0" width="200" height="360" fill="#f7c8a8"/>
  <rect x="600" y="0" width="200" height="360" fill="#31446b"/>
  <!-- 晨:半升太阳 -->
  <circle cx="100" cy="120" r="30" fill="#ffb46b"/>
  <path d="M60 120 h80" stroke="#f7a35a" stroke-width="3"/>
  <text x="100" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#b06a28">morning</text>
  <!-- 午:高阳 -->
  <circle cx="300" cy="82" r="28" fill="#ffd66b"/>
  <g stroke="#f2b73f" stroke-width="4">
    <line x1="300" y1="40" x2="300" y2="28"/><line x1="300" y1="124" x2="300" y2="136"/>
    <line x1="258" y1="82" x2="246" y2="82"/><line x1="342" y1="82" x2="354" y2="82"/>
  </g>
  <text x="300" y="170" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a97b18">afternoon</text>
  <!-- 暮:落日 -->
  <circle cx="500" cy="140" r="26" fill="#ef8a5a"/>
  <ellipse cx="500" cy="96" rx="42" ry="12" fill="#ffffff" opacity="0.6"/>
  <text x="500" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a04e20">evening</text>
  <!-- 夜:月与星 -->
  <path d="M712 92 a26 26 0 1 0 14 46 a21 21 0 0 1 -14 -46 Z" fill="#ffd66b"/>
  <g fill="#ffe9a8">
    <circle cx="650" cy="70" r="3"/><circle cx="680" cy="130" r="2.5"/><circle cx="756" cy="66" r="2.5"/><circle cx="770" cy="140" r="3"/>
  </g>
  <text x="700" y="52" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffe9a8">night</text>

  <!-- 地面 -->
  <rect x="0" y="360" width="800" height="240" fill="#b5e08c"/>
  <rect x="0" y="360" width="800" height="10" fill="#8cc06a"/>

  <!-- 钟楼(中央,跨昼夜) -->
  <g>
    <rect x="356" y="120" width="88" height="250" fill="#fde8c8" stroke="#d9b98c" stroke-width="4"/>
    <polygon points="344,120 456,120 400,66" fill="#ef5350" stroke="#c73835" stroke-width="3"/>
    <circle cx="400" cy="188" r="34" fill="#fffbe9" stroke="#8a5a33" stroke-width="5"/>
    <line x1="400" y1="188" x2="400" y2="164" stroke="#8a5a33" stroke-width="4"/>
    <line x1="400" y1="188" x2="418" y2="196" stroke="#8a5a33" stroke-width="3"/>
    <circle cx="400" cy="188" r="3.5" fill="#8a5a33"/>
    <!-- 小时刻度牌与秒表牌 -->
    <rect x="362" y="242" width="76" height="30" rx="6" fill="#ffffff" stroke="#d9b98c" stroke-width="3"/>
    <text x="400" y="263" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#4a76a8">60 min</text>
    <rect x="362" y="282" width="76" height="30" rx="6" fill="#ffffff" stroke="#d9b98c" stroke-width="3"/>
    <text x="400" y="303" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#ef5350">24 h</text>
    <rect x="382" y="322" width="36" height="48" fill="#a5683b" stroke="#7a4a21" stroke-width="3"/>
  </g>

  <!-- 日历牌坊(左) -->
  <g>
    <rect x="30" y="220" width="150" height="130" rx="10" fill="#ffffff" stroke="#d9b98c" stroke-width="4"/>
    <rect x="30" y="220" width="150" height="34" rx="10" fill="#ef5350"/>
    <text x="105" y="244" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fff">TODAY</text>
    <text x="105" y="304" font-family="system-ui, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#2d2f3a">29</text>
    <text x="105" y="334" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#8b8fa3">AUG · WEEK 35</text>
  </g>

  <!-- 年历烟花牌(右,夜区) -->
  <g>
    <rect x="628" y="228" width="144" height="122" rx="10" fill="#1f2c47" stroke="#0f1626" stroke-width="4"/>
    <text x="700" y="268" font-family="system-ui, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#ffd66b">2026</text>
    <g stroke="#ef9fae" stroke-width="2.5">
      <line x1="664" y1="296" x2="664" y2="310"/><line x1="657" y1="303" x2="671" y2="303"/>
      <line x1="659" y1="298" x2="669" y2="308"/><line x1="669" y1="298" x2="659" y2="308"/>
    </g>
    <g stroke="#7fd4c1" stroke-width="2.5">
      <line x1="736" y1="300" x2="736" y2="316"/><line x1="728" y1="308" x2="744" y2="308"/>
      <line x1="730" y1="302" x2="742" y2="314"/><line x1="742" y1="302" x2="730" y2="314"/>
    </g>
    <text x="700" y="338" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#c9d2e0">12 months</text>
  </g>

  <!-- 人物群像(草地前排) -->
  <!-- 老师(指着黑板方向) -->
  <g>
    <circle cx="80" cy="420" r="19" fill="#f7c8a0"/>
    <path d="M54 490 q26 -34 52 0 Z" fill="#8f62ad"/>
    <line x1="96" y1="436" x2="122" y2="424" stroke="#f7c8a0" stroke-width="6" stroke-linecap="round"/>
    <rect x="124" y="404" width="44" height="34" rx="4" fill="#2f7d5a" stroke="#1d5c40" stroke-width="3"/>
    <text x="146" y="428" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fff">A</text>
  </g>
  <!-- 学生(背书包) -->
  <g>
    <circle cx="212" cy="428" r="16" fill="#e8b48c"/>
    <path d="M192 488 q20 -28 40 0 Z" fill="#7fb7ef"/>
    <rect x="226" y="446" width="18" height="26" rx="5" fill="#ef5350" stroke="#c73835" stroke-width="2.5"/>
  </g>
  <!-- 男孩与女孩(手拉手 = friend) -->
  <g>
    <circle cx="292" cy="430" r="15" fill="#f7c8a0"/>
    <path d="M274 486 q18 -26 36 0 Z" fill="#2fae74"/>
    <circle cx="348" cy="430" r="15" fill="#e8b48c"/>
    <path d="M330 486 q18 -26 36 0 Z" fill="#ef9fae"/>
    <path d="M348 445 q-4 14 -14 18" fill="none" stroke="#e8b48c" stroke-width="5" stroke-linecap="round"/>
    <line x1="308" y1="458" x2="334" y2="462" stroke="#f7c8a0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 小组围圈(group) -->
  <g>
    <circle cx="470" cy="430" r="13" fill="#f7c8a0"/><path d="M456 478 q14 -22 28 0 Z" fill="#f2b73f"/>
    <circle cx="508" cy="422" r="13" fill="#e8b48c"/><path d="M494 470 q14 -22 28 0 Z" fill="#7fd4c1"/>
    <circle cx="544" cy="432" r="13" fill="#f7c8a0"/><path d="M530 480 q14 -22 28 0 Z" fill="#ef7f7f"/>
    <ellipse cx="506" cy="492" rx="58" ry="10" fill="#8cc06a"/>
  </g>
  <!-- 球队(team,夜区草地踢球) -->
  <g>
    <circle cx="654" cy="428" r="14" fill="#e8b48c"/>
    <path d="M638 482 q16 -24 32 0 Z" fill="#ef5350"/>
    <circle cx="716" cy="424" r="14" fill="#f7c8a0"/>
    <path d="M700 478 q16 -24 32 0 Z" fill="#ef5350"/>
    <circle cx="686" cy="500" r="11" fill="#ffffff" stroke="#2d2f3a" stroke-width="2.5"/>
    <path d="M681 495 l10 10 M691 495 l-10 10" stroke="#2d2f3a" stroke-width="2"/>
  </g>

  <!-- 姓名牌(name):挂脖工牌 -->
  <g>
    <rect x="56" y="524" width="104" height="52" rx="8" fill="#ffffff" stroke="#d9b98c" stroke-width="3"/>
    <circle cx="80" cy="550" r="12" fill="#f7c8a0"/>
    <rect x="98" y="538" width="52" height="8" rx="3" fill="#7fb7ef"/>
    <rect x="98" y="554" width="40" height="7" rx="3" fill="#c9d2e0"/>
    <path d="M100 524 q8 -12 16 0" fill="none" stroke="#8b8fa3" stroke-width="3"/>
  </g>

  <!-- 班级门牌(class):Class 1 -->
  <g>
    <rect x="230" y="524" width="120 " height="48" rx="8" fill="#f2b73f" stroke="#d09a28" stroke-width="3"/>
    <text x="290" y="556" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#7a4a21">CLASS 1</text>
  </g>

  <!-- 沙漏(hour)与秒表(minute)(钟楼脚下) -->
  <g>
    <path d="M436 540 h36 l-13 22 l13 22 h-36 l13 -22 Z" fill="#c9dff2" stroke="#8fb6dc" stroke-width="3"/>
    <path d="M444 546 h20 l-10 14 Z" fill="#f2b73f"/>
    <rect x="432" y="534" width="44" height="7" rx="3" fill="#a9683a"/>
    <rect x="432" y="583" width="44" height="7" rx="3" fill="#a9683a"/>
  </g>
  <g>
    <circle cx="540" cy="562" r="22" fill="#fffbe9" stroke="#4a6fa5" stroke-width="5"/>
    <line x1="540" y1="562" x2="540" y2="546" stroke="#33507c" stroke-width="3"/>
    <rect x="534" y="532" width="12" height="8" rx="2" fill="#4a6fa5"/>
  </g>
</svg>
