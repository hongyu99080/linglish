<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="数字乐园场景插图">
  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="470" fill="#d8edf9"/>
  <circle cx="70" cy="64" r="30" fill="#ffd66b"/>
  <ellipse cx="600" cy="60" rx="54" ry="16" fill="#ffffff" opacity="0.85"/>
  <!-- 草地 -->
  <rect x="0" y="470" width="800" height="130" fill="#b5e08c"/>

  <!-- 风筝串:11-20(左上区) -->
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <path d="M120 210 q60 -60 130 -44 q70 16 130 -30 q52 -38 110 -30" fill="none" stroke="#caa06a" stroke-width="3"/>
    <g transform="rotate(-12 120 210)"><polygon points="120,186 146,210 120,234 94,210" fill="#ef7f7f" stroke="#c95b5b" stroke-width="3"/><text x="120" y="218" font-size="20" fill="#fff">11</text></g>
    <g transform="rotate(8 250 166)"><polygon points="250,142 276,166 250,190 224,166" fill="#7fb7ef" stroke="#4a76a8" stroke-width="3"/><text x="250" y="174" font-size="20" fill="#fff">12</text></g>
    <g transform="rotate(-6 380 136)"><polygon points="380,112 406,136 380,160 354,136" fill="#8fd18f" stroke="#5aa35a" stroke-width="3"/><text x="380" y="144" font-size="20" fill="#fff">13</text></g>
    <g transform="rotate(10 490 106)"><polygon points="490,82 516,106 490,130 464,106" fill="#f2b73f" stroke="#d09a28" stroke-width="3"/><text x="490" y="114" font-size="20" fill="#fff">15</text></g>
  </g>

  <!-- 气球束:20/30/50(右上区) -->
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <line x1="668" y1="240" x2="640" y2="140" stroke="#caa06a" stroke-width="2.5"/>
    <line x1="668" y1="240" x2="688" y2="128" stroke="#caa06a" stroke-width="2.5"/>
    <line x1="668" y1="240" x2="732" y2="150" stroke="#caa06a" stroke-width="2.5"/>
    <ellipse cx="640" cy="118" rx="27" ry="33" fill="#ef7f7f" stroke="#c95b5b" stroke-width="3"/><text x="640" y="128" font-size="22" fill="#fff">20</text>
    <ellipse cx="688" cy="104" rx="27" ry="33" fill="#b98fd1" stroke="#8f62ad" stroke-width="3"/><text x="688" y="114" font-size="22" fill="#fff">30</text>
    <ellipse cx="734" cy="128" rx="27" ry="33" fill="#7fd4c1" stroke="#4aa392" stroke-width="3"/><text x="734" y="138" font-size="22" fill="#fff">50</text>
  </g>

  <!-- 小火车 1-10:两节轨道贯穿中部 -->
  <rect x="0" y="332" width="800" height="8" fill="#8a5a33"/>
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <!-- 车头 -->
    <rect x="24" y="276" width="66" height="56" rx="10" fill="#ef5350" stroke="#c73835" stroke-width="3"/>
    <rect x="76" y="252" width="30" height="36" rx="6" fill="#c73835"/>
    <circle cx="44" cy="336" r="13" fill="#2d2f3a"/><circle cx="76" cy="336" r="13" fill="#2d2f3a"/>
    <!-- 车厢 1-5 -->
    <g>
      <rect x="112" y="284" width="56" height="48" rx="8" fill="#f2b73f" stroke="#d09a28" stroke-width="3"/><text x="140" y="318" font-size="26" fill="#fff">1</text>
      <circle cx="128" cy="336" r="10" fill="#2d2f3a"/><circle cx="152" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="176" y="284" width="56" height="48" rx="8" fill="#8fd18f" stroke="#5aa35a" stroke-width="3"/><text x="204" y="318" font-size="26" fill="#fff">2</text>
      <circle cx="192" cy="336" r="10" fill="#2d2f3a"/><circle cx="216" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="240" y="284" width="56" height="48" rx="8" fill="#7fb7ef" stroke="#4a76a8" stroke-width="3"/><text x="268" y="318" font-size="26" fill="#fff">3</text>
      <circle cx="256" cy="336" r="10" fill="#2d2f3a"/><circle cx="280" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="304" y="284" width="56" height="48" rx="8" fill="#b98fd1" stroke="#8f62ad" stroke-width="3"/><text x="332" y="318" font-size="26" fill="#fff">4</text>
      <circle cx="320" cy="336" r="10" fill="#2d2f3a"/><circle cx="344" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="368" y="284" width="56" height="48" rx="8" fill="#ef9fae" stroke="#d9808f" stroke-width="3"/><text x="396" y="318" font-size="26" fill="#fff">5</text>
      <circle cx="384" cy="336" r="10" fill="#2d2f3a"/><circle cx="408" cy="336" r="10" fill="#2d2f3a"/>
    </g>
    <!-- 车厢 6-10 -->
    <g>
      <rect x="432" y="284" width="56" height="48" rx="8" fill="#7fd4c1" stroke="#4aa392" stroke-width="3"/><text x="460" y="318" font-size="26" fill="#fff">6</text>
      <circle cx="448" cy="336" r="10" fill="#2d2f3a"/><circle cx="472" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="496" y="284" width="56" height="48" rx="8" fill="#f2946d" stroke="#d0794a" stroke-width="3"/><text x="524" y="318" font-size="26" fill="#fff">7</text>
      <circle cx="512" cy="336" r="10" fill="#2d2f3a"/><circle cx="536" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="560" y="284" width="56" height="48" rx="8" fill="#f2b73f" stroke="#d09a28" stroke-width="3"/><text x="588" y="318" font-size="26" fill="#fff">8</text>
      <circle cx="576" cy="336" r="10" fill="#2d2f3a"/><circle cx="600" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="624" y="284" width="56" height="48" rx="8" fill="#8fd18f" stroke="#5aa35a" stroke-width="3"/><text x="652" y="318" font-size="26" fill="#fff">9</text>
      <circle cx="640" cy="336" r="10" fill="#2d2f3a"/><circle cx="664" cy="336" r="10" fill="#2d2f3a"/>
      <rect x="688" y="284" width="60" height="48" rx="8" fill="#7fb7ef" stroke="#4a76a8" stroke-width="3"/><text x="718" y="318" font-size="26" fill="#fff">10</text>
      <circle cx="704" cy="336" r="10" fill="#2d2f3a"/><circle cx="732" cy="336" r="10" fill="#2d2f3a"/>
    </g>
  </g>

  <!-- 领奖台 1st/2nd/3rd(左下) -->
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="36" y="426" width="66" height="66" fill="#f2b73f" stroke="#d09a28" stroke-width="3"/><text x="69" y="466" font-size="24" fill="#7a5a10">1st</text>
    <rect x="102" y="446" width="66" height="46" fill="#c9d2e0" stroke="#9aa7bc" stroke-width="3"/><text x="135" y="478" font-size="22" fill="#4a5568">2nd</text>
    <rect x="168" y="458" width="66" height="34" fill="#e0b08c" stroke="#bd8a5e" stroke-width="3"/><text x="201" y="484" font-size="20" fill="#7a4a21">3rd</text>
    <circle cx="69" cy="404" r="16" fill="#ffd66b" stroke="#d09a28" stroke-width="3"/>
  </g>

  <!-- 百数牌(hundred):立牌 -->
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="286" y="398" width="104" height="64" rx="10" fill="#fffbe9" stroke="#d9b98c" stroke-width="4"/>
    <text x="338" y="442" font-size="34" fill="#ef5350">100</text>
    <line x1="312" y1="462" x2="304" y2="496" stroke="#a9683a" stroke-width="5"/>
    <line x1="364" y1="462" x2="372" y2="496" stroke="#a9683a" stroke-width="5"/>
  </g>

  <!-- 半个苹果(half):野餐布上 -->
  <g>
    <rect x="428" y="420" width="130" height="76" rx="10" fill="#fce4e3" stroke="#ef9fae" stroke-width="3"/>
    <path d="M428 440 h130 M428 460 h130 M428 480 h130 M452 420 v76 M480 420 v76 M508 420 v76 M536 420 v76" stroke="#ef9fae" stroke-width="2" opacity="0.55"/>
    <path d="M470 470 a22 24 0 0 1 0 -44 l0 44 Z" fill="#ef5350" stroke="#c73835" stroke-width="3"/>
    <path d="M474 470 l0 -44 a22 24 0 0 1 0 44 Z" fill="#fff3dd" stroke="#e0c98f" stroke-width="3"/>
    <circle cx="481" cy="444" r="2.5" fill="#7a4a21"/><circle cx="481" cy="456" r="2.5" fill="#7a4a21"/>
    <line x1="472" y1="426" x2="470" y2="416" stroke="#5aa35a" stroke-width="4"/>
  </g>

  <!-- 花坛:many(一大丛) vs few(两三朵) -->
  <g>
    <ellipse cx="620" cy="500" rx="70" ry="20" fill="#8cc06a"/>
    <g stroke="#5a9e3f" stroke-width="3">
      <line x1="586" y1="494" x2="586" y2="468"/><line x1="606" y1="498" x2="606" y2="464"/>
      <line x1="626" y1="494" x2="626" y2="470"/><line x1="646" y1="498" x2="646" y2="466"/>
      <line x1="664" y1="494" x2="664" y2="472"/>
    </g>
    <circle cx="586" cy="462" r="8" fill="#ef7fae"/><circle cx="606" cy="458" r="9" fill="#ffd66b"/>
    <circle cx="626" cy="464" r="8" fill="#7fb7ef"/><circle cx="646" cy="460" r="9" fill="#ef7f7f"/>
    <circle cx="664" cy="466" r="8" fill="#b98fd1"/>
    <circle cx="596" cy="474" r="7" fill="#f2946d"/><circle cx="636" cy="476" r="7" fill="#8fd18f"/>
  </g>
  <g>
    <ellipse cx="748" cy="508" rx="36" ry="14" fill="#8cc06a"/>
    <line x1="740" y1="502" x2="740" y2="480" stroke="#5a9e3f" stroke-width="3"/>
    <line x1="758" y1="504" x2="758" y2="486" stroke="#5a9e3f" stroke-width="3"/>
    <circle cx="740" cy="474" r="7" fill="#ffd66b"/>
    <circle cx="758" cy="481" r="6" fill="#ef7fae"/>
  </g>

  <!-- 数字積木(number) + 算盘(count)(左中空地) -->
  <g font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="252" y="508" width="40" height="40" rx="6" fill="#7fb7ef" stroke="#4a76a8" stroke-width="3"/><text x="272" y="536" font-size="24" fill="#fff">7</text>
    <rect x="298" y="508" width="40" height="40" rx="6" fill="#ef7f7f" stroke="#c95b5b" stroke-width="3"/><text x="318" y="536" font-size="24" fill="#fff">4</text>
  </g>
  <g>
    <rect x="88" y="516" width="120" height="52" rx="8" fill="#d9a05b" stroke="#a9683a" stroke-width="4"/>
    <line x1="108" y1="516" x2="108" y2="568" stroke="#a9683a" stroke-width="3"/>
    <line x1="148" y1="516" x2="148" y2="568" stroke="#a9683a" stroke-width="3"/>
    <line x1="188" y1="516" x2="188" y2="568" stroke="#a9683a" stroke-width="3"/>
    <circle cx="108" cy="530" r="7" fill="#ef5350"/><circle cx="108" cy="548" r="7" fill="#ef5350"/>
    <circle cx="148" cy="536" r="7" fill="#f2b73f"/><circle cx="148" cy="554" r="7" fill="#f2b73f"/>
    <circle cx="188" cy="528" r="7" fill="#7fb7ef"/><circle cx="188" cy="546" r="7" fill="#7fb7ef"/>
  </g>
</svg>
